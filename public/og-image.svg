<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sujay Kumar — Machine Learning Researcher">
  <!-- Content is horizontally centred on purpose. Chat apps and some search
       surfaces render link previews as a small SQUARE thumbnail by centre-
       cropping this 1200x630 image to its middle ~630px. Left-aligned text
       gets sliced off in that crop, so every element is anchored to x=600. -->

  <rect width="1200" height="630" fill="#080808" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)" />

  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="140" cy="90" r="1.5" opacity="0.5" />
    <circle cx="300" cy="150" r="1" opacity="0.35" />
    <circle cx="520" cy="80" r="1.2" opacity="0.45" />
    <circle cx="720" cy="140" r="1" opacity="0.3" />
    <circle cx="980" cy="90" r="1.6" opacity="0.5" />
    <circle cx="1080" cy="220" r="1" opacity="0.35" />
    <circle cx="1120" cy="470" r="1.4" opacity="0.4" />
    <circle cx="880" cy="540" r="1" opacity="0.3" />
    <circle cx="220" cy="520" r="1.3" opacity="0.4" />
    <circle cx="60" cy="360" r="1" opacity="0.3" />
    <circle cx="440" cy="560" r="1.1" opacity="0.35" />
    <circle cx="640" cy="500" r="1" opacity="0.3" />
  </g>

  <!-- content frame -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#0c0c0c" stroke="#242424" />

  <!-- brand mark, centred -->
  <g transform="translate(578,132)">
    <g stroke="#d4d4d4" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <line x1="0" y1="10" x2="20" y2="22" />
      <line x1="0" y1="34" x2="20" y2="22" />
      <line x1="20" y1="22" x2="38" y2="6" />
      <line x1="20" y1="22" x2="38" y2="38" />
    </g>
    <g fill="#ededed">
      <circle cx="0" cy="10" r="4" />
      <circle cx="0" cy="34" r="4" />
      <circle cx="20" cy="22" r="4.6" />
      <circle cx="38" cy="38" r="4" />
    </g>
    <circle cx="38" cy="6" r="4.6" fill="#5cc090" />
  </g>

  <text x="600" y="238" text-anchor="middle" fill="#8a8a8a" font-size="22" letter-spacing="3" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace">
    MACHINE LEARNING · APPLIED AI
  </text>

  <text x="600" y="336" text-anchor="middle" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1.5" font-size="84" font-weight="700" letter-spacing="1" font-family="monospace, 'JetBrains Mono', ui-monospace, Menlo">
    Sujay Kumar
  </text>

  <text x="600" y="392" text-anchor="middle" fill="#b5b5b5" font-size="30" font-family="monospace, 'JetBrains Mono', ui-monospace, Menlo">
    Machine Learning Researcher
  </text>

  <text x="600" y="440" text-anchor="middle" fill="#7d7d7d" font-size="21" font-family="monospace, 'JetBrains Mono', ui-monospace, Menlo">
    Deep Learning · NLP · Research · Writing
  </text>

  <!-- url pill, centred -->
  <rect x="466" y="474" width="268" height="48" rx="24" fill="#f5f5f5" />
  <text x="600" y="506" text-anchor="middle" fill="#0a0a0a" font-size="23" font-weight="600" font-family="monospace, 'JetBrains Mono', ui-monospace, Menlo">
    kumarsujay.dev
  </text>
</svg>
